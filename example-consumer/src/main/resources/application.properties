rpc.name=Sosrpc
rpc.version=2.0
rpc.mock=false
rpc.serializer=kryo
rpc.loadBalancer=roundRobin
rpc.retryStrategy=no
rpc.tolerantStrategy=failFast
rpc.fallbackClass=com.achingsoul.example.consumer.UserServiceFallback
rpc.rateLimiterEnabled=false
rpc.rateLimitCapacity=10
rpc.rateLimitRefillRate=10.0
rpc.circuitBreakerEnabled=false
rpc.circuitBreakerFailureThreshold=3
rpc.circuitBreakerOpenDuration=5000
rpc.circuitBreakerHalfOpenSuccessThreshold=1
rpc.registryConfig.registry=etcd
rpc.registryConfig.address=http://localhost:2379
